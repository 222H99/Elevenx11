<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修复 Eleven×11 更新</title>
<style>html,body{margin:0;height:100%;background:#fafafa;color:#111;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;align-items:center;justify-content:center}.box{padding:28px;text-align:center;max-width:330px}h1{font-size:20px;margin:0 0 10px}p{font-size:13px;line-height:1.6;color:#666;margin:8px 0}.ok{color:#0a7a3d;font-weight:700}</style></head><body><div class="box"><h1>正在修复更新</h1><p id="s">正在清理旧缓存和旧 Service Worker…</p><p>完成后会自动打开最新版。</p></div>
<script>
(async function(){
  var s=document.getElementById('s');
  try{ if(navigator.serviceWorker){ var rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function(r){return r.unregister().catch(function(){});})); } }catch(e){}
  try{ if(window.caches){ var ks=await caches.keys(); await Promise.all(ks.map(function(k){return caches.delete(k).catch(function(){});})); } }catch(e){}
  try{ sessionStorage.clear(); }catch(e){}
  s.textContent='旧缓存已清理，正在打开最新版…'; s.className='ok';
  setTimeout(function(){ location.replace('./index.html?__u='+Date.now().toString(36)+'&skipabout=1'); },900);
})();
</script></body></html>
